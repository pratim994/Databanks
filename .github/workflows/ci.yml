name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: banking_user
          POSTGRES_PASSWORD: banking_test_password
          POSTGRES_DB: banking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U banking_user -d banking"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dbt-postgres ruff pytest

      - name: Run linters
        run: ruff check .

      - name: Run unit tests
        run: |
          if [ -d tests ]; then
            pytest tests/
          else
            echo "No tests directory found; skipping unit tests."
          fi

      - name: Setup dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOF'
          banking_dbt:
            target: dev
            outputs:
              dev:
                type: postgres
                host: localhost
                user: banking_user
                password: banking_test_password
                port: 5432
                dbname: banking
                schema: analytics
                threads: 4
          EOF

      - name: dbt dependencies
        working-directory: banking_dbt
        run: dbt deps

      - name: dbt compile
        working-directory: banking_dbt
        run: dbt compile