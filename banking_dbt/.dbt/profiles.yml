banking_dbt:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('DBT_HOST', env_var('POSTGRES_HOST', 'localhost')) }}"
      port: "{{ env_var('DBT_PORT', env_var('POSTGRES_PORT', '5433')) | int }}"
      user: "{{ env_var('DBT_USER', env_var('POSTGRES_USER')) }}"
      password: "{{ env_var('DBT_PASSWORD', env_var('POSTGRES_PASSWORD')) }}"
      dbname: "{{ env_var('DBT_DBNAME', env_var('POSTGRES_DB')) }}"
      schema: analytics
      threads: 4
      connect_timeout: 10
